<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfyaBora - Set New Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-screen">
    <div class="auth-side">
      <div class="auth-side-content">
        <div class="brand-mark">A</div>
        <h1>AfyaBora</h1>
        <p>Choose a new password to secure your account.</p>
      </div>
    </div>

    <div class="auth-main">
      <div class="auth-card">
        <h2 class="form-title">Set a new password</h2>

        <div id="invalid-link" class="form-error" hidden>
          This reset link is invalid or has expired. <a href="/forgot-password">Request a new one</a>.
        </div>

        <form id="reset-form">
          <label class="field">
            <span>New password</span>
            <input type="password" id="new-password" autocomplete="new-password" required>
          </label>

          <label class="field">
            <span>Confirm password</span>
            <input type="password" id="confirm-password" autocomplete="new-password" required>
          </label>

          <p class="form-error" id="form-error" hidden></p>

          <button type="submit" class="btn-primary" id="submit-btn">Update password</button>
        </form>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/reset-password.js') }}"></script>
</body>
</html>
