<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfyaBora - Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-screen">
    <div class="auth-side">
      <div class="auth-side-content">
        <div class="brand-mark">A</div>
        <h1>AfyaBora</h1>
        <p>We'll send a secure link to reset your password.</p>
      </div>
    </div>

    <div class="auth-main">
      <div class="auth-card">
        <h2 class="form-title">Reset your password</h2>

        <form id="forgot-form">
          <label class="field">
            <span>Email</span>
            <input type="email" id="email" autocomplete="email" required>
          </label>

          <p class="form-error" id="form-error" hidden></p>
          <p class="form-success" id="form-success" hidden></p>

          <button type="submit" class="btn-primary" id="submit-btn">Send reset link</button>
        </form>

        <p class="form-footer"><a href="/">Back to log in</a></p>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/forgot-password.js') }}"></script>
</body>
</html>
